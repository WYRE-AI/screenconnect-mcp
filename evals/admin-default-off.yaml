name: admin tools are not callable by default
server:
  command: node
  args: [dist/index.js]
  env:
    SCREENCONNECT_BASE_URL: https://sc-eval.screenconnect.com
    SCREENCONNECT_API_SECRET: eval-secret-not-real-0000
    SCREENCONNECT_TOOL_TIERS: read
assert:
  tool: screenconnect_session_send_command
  args:
    sessionId: 11111111-2222-4333-8444-555555555555
    commandText: echo hello
    confirm: true
  expect:
    is_error: true
    contains: ['disabled']
timeout: 30s
