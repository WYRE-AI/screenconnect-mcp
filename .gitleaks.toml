title = "screenconnect-mcp gitleaks config"

[extend]
useDefault = true

# Exact fake values used by the test suite (src/__tests__/helpers.ts) and the
# stdio smoke script. Each entry is anchored to the full value; do not widen
# these to patterns or paths.
[[allowlists]]
description = "Exact test fixtures"
regexTarget = "secret"
regexes = [
  '''^eval-secret-not-real-0000$''',
  '''^test-only-s2s-value-0123456789abcdef$''',
]
